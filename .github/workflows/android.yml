name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Test and build debug APK
    runs-on: ubuntu-24.04

    env:
      FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare optional Firebase config
        shell: bash
        run: |
          if [[ -n "${FIREBASE_GOOGLE_SERVICES_JSON:-}" ]]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase Android config enabled for this build."
            if jq -e '.client[]?.oauth_client[]? | select(.client_type == 3)' app/google-services.json >/dev/null; then
              echo "Firebase Google OAuth client found."
            else
              echo "::warning::google-services.json does not contain a Web OAuth client (client_type 3). Google Sign-In will not work until the Firebase Google provider is enabled and the config secret is replaced."
            fi
          else
            echo "Firebase config secret not set; building the offline auth setup state."
          fi

      - name: Prepare optional stable test signing key
        shell: bash
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" &&                 -n "${ANDROID_KEYSTORE_PASSWORD:-}" &&                 -n "${ANDROID_KEY_ALIAS:-}" &&                 -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/meter-reader-test.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64"               | sed '/^---/d'               | tr -d '\r\n '               | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

            SHA1="$(
              keytool -list -v                 -keystore "$KEYSTORE_PATH"                 -alias "$ANDROID_KEY_ALIAS"                 -storepass "$ANDROID_KEYSTORE_PASSWORD"                 | sed -n 's/.*SHA1: //p'                 | head -n 1
            )"
            echo "Stable CI test signing SHA-1: $SHA1"
          else
            echo "Android signing secrets are not set; using the default debug signing key."
          fi

      # Keep push/PR feedback fast. The publish workflow separately validates
      # the optimized release APK/AAB with R8 before creating a release.
      - name: Run unit tests and build debug APK
        run: ./gradlew --build-cache testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: meter-reader-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
