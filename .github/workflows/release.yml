name: Create App Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Kiadási csatorna"
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
      publish_to_play:
        description: "Feltöltés Google Playre"
        required: true
        default: true
        type: boolean
      play_track:
        description: "Beta Play track neve; stable esetén automatikusan production"
        required: true
        default: closed-beta
        type: string
      source_run_id:
        description: "Opcionális: sikeres GitHub Action run ID"
        required: false
        default: ""
        type: string
      source_ref:
        description: "Branch, tag vagy commit SHA, ha nincs run ID"
        required: true
        default: main
        type: string
      version_name:
        description: "Alapverzió, pl. 0.12.0"
        required: true
        default: "0.12.0"
        type: string
      version_code:
        description: "Android versionCode, mindig növekvő egész szám"
        required: true
        default: "15"
        type: string
      release_notes:
        description: "Rövid kiadási megjegyzés"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: app-release-${{ inputs.channel }}-${{ inputs.version_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and publish ${{ inputs.channel }}
    runs-on: ubuntu-latest

    env:
      APP_VERSION_BASE: ${{ inputs.version_name }}
      APP_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
      ANDROID_EXPECTED_UPLOAD_SHA1: ${{ secrets.ANDROID_EXPECTED_UPLOAD_SHA1 }}
      RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_REF_INPUT: ${{ inputs.source_ref }}
      BETA_PLAY_TRACK: ${{ inputs.play_track }}

    steps:
      - name: Resolve source Action or ref
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$SOURCE_RUN_ID" ]]; then
            if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::source_run_id must be a numeric GitHub Actions run ID."
              exit 1
            fi

            RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
            STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.status')"
            CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion')"
            SHA="$(printf '%s' "$RUN_JSON" | jq -r '.head_sha')"
            RUN_URL="$(printf '%s' "$RUN_JSON" | jq -r '.html_url')"

            if [[ "$STATUS" != "completed" || "$CONCLUSION" != "success" ]]; then
              echo "::error::The selected Action run must be completed successfully."
              exit 1
            fi

            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "description=Action run #$SOURCE_RUN_ID ($SHA)" >> "$GITHUB_OUTPUT"
            echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$SOURCE_REF_INPUT" >> "$GITHUB_OUTPUT"
            echo "description=ref $SOURCE_REF_INPUT" >> "$GITHUB_OUTPUT"
            echo "run_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare optional Firebase config
        shell: bash
        run: |
          if [[ -n "${FIREBASE_GOOGLE_SERVICES_JSON:-}" ]]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase Android config enabled for this release."
          else
            echo "Firebase config secret not set."
          fi

      - name: Validate release inputs and secrets
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$APP_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version_code must be a positive integer."
            exit 1
          fi

          if ! [[ "$APP_VERSION_BASE" =~ ^[0-9]+([.][0-9]+){1,3}$ ]]; then
            echo "::error::version_name must look like 0.12.0."
            exit 1
          fi

          if [[ ! -s app/google-services.json ]]; then
            echo "::error::Firebase config is required for release builds. Set FIREBASE_GOOGLE_SERVICES_JSON or add app/google-services.json."
            exit 1
          fi

          missing=0
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Beta and stable releases require the permanent Android signing key."
            exit 1
          fi

          if [[ "${{ inputs.publish_to_play }}" == "true" ]]; then
            if [[ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
              exit 1
            fi

            if [[ "${{ inputs.channel }}" == "beta" && -z "$BETA_PLAY_TRACK" ]]; then
              echo "::error::play_track cannot be empty for beta releases."
              exit 1
            fi
          fi

      - name: Set effective app version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.channel }}" == "beta" ]]; then
            EFFECTIVE_VERSION="${APP_VERSION_BASE}-beta.${GITHUB_RUN_NUMBER}"
          else
            EFFECTIVE_VERSION="${APP_VERSION_BASE}"
          fi

          echo "APP_VERSION_NAME=$EFFECTIVE_VERSION" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Prepare Android signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/meter-reader-release.jks"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | sed '/^---/d' \
            | tr -d '\r\n ' \
            | base64 --decode > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify upload signing certificate
        shell: bash
        run: |
          set -euo pipefail

          CERT_OUTPUT="$(
            keytool -list -v               -keystore "$ANDROID_KEYSTORE_PATH"               -alias "$ANDROID_KEY_ALIAS"               -storepass "$ANDROID_KEYSTORE_PASSWORD"
          )"

          ACTUAL_SHA1="$(
            printf '%s\n' "$CERT_OUTPUT"               | sed -n 's/.*SHA1: //p'               | head -n 1               | tr '[:lower:]' '[:upper:]'
          )"

          if [[ -z "$ACTUAL_SHA1" ]]; then
            echo "::error::Could not determine upload certificate SHA-1."
            exit 1
          fi

          echo "Upload certificate SHA-1: $ACTUAL_SHA1"
          echo "UPLOAD_CERT_SHA1=$ACTUAL_SHA1" >> "$GITHUB_ENV"

          if [[ -n "${ANDROID_EXPECTED_UPLOAD_SHA1:-}" ]]; then
            EXPECTED_SHA1="$(
              printf '%s' "$ANDROID_EXPECTED_UPLOAD_SHA1"                 | tr '[:lower:]' '[:upper:]'
            )"

            if [[ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]]; then
              echo "::error::Wrong Android upload key. Expected $EXPECTED_SHA1 but keystore uses $ACTUAL_SHA1."
              exit 1
            fi
          fi

      - name: Build signed APK and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Prepare release files and Play notes
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          SOURCE_AAB="app/build/outputs/bundle/release/app-release.aab"

          test -f "$SOURCE_APK"
          test -f "$SOURCE_AAB"

          mkdir -p dist
          mkdir -p distribution/whatsnew

          APK_NAME="meter-reader-${APP_VERSION_NAME}.apk"
          AAB_NAME="meter-reader-${APP_VERSION_NAME}.aab"
          TAG="v${APP_VERSION_NAME}"
          TITLE="Mérőóra Napló ${APP_VERSION_NAME}"

          cp "$SOURCE_APK" "dist/$APK_NAME"
          cp "$SOURCE_AAB" "dist/$AAB_NAME"

          sha256sum "dist/$APK_NAME" > "dist/$APK_NAME.sha256"
          sha256sum "dist/$AAB_NAME" > "dist/$AAB_NAME.sha256"

          if [[ -n "$RELEASE_NOTES_INPUT" ]]; then
            printf '%s\n' "$RELEASE_NOTES_INPUT" > distribution/whatsnew/whatsnew-hu-HU
          elif [[ -s PLAY_RELEASE_NOTES_HU.txt ]]; then
            cp PLAY_RELEASE_NOTES_HU.txt distribution/whatsnew/whatsnew-hu-HU
          else
            printf 'Megújult a Mérőóra Napló. Több kisebb fejlesztést és hibajavítást készítettünk.\n' > distribution/whatsnew/whatsnew-hu-HU
          fi

          if [[ "${{ inputs.channel }}" == "beta" ]]; then
            PLAY_TRACK="$BETA_PLAY_TRACK"
          else
            PLAY_TRACK="production"
          fi

          {
            echo "## Mérőóra Napló ${APP_VERSION_NAME}"
            echo
            echo "- Csatorna: ${{ inputs.channel }}"
            echo "- Version code: ${APP_VERSION_CODE}"
            echo "- Forrás: ${{ steps.source.outputs.description }}"
            if [[ -n "${{ steps.source.outputs.run_url }}" ]]; then
              echo "- Forrás Action: ${{ steps.source.outputs.run_url }}"
            fi
            echo "- Google Play track: $PLAY_TRACK"
            echo "- Upload cert SHA-1: ${UPLOAD_CERT_SHA1:-unknown}"
            echo
            echo "### Újdonságok"
            if [[ -n "$RELEASE_NOTES_INPUT" ]]; then
              printf '%s\n' "$RELEASE_NOTES_INPUT"
            elif [[ -s PLAY_RELEASE_NOTES_HU.txt ]]; then
              cat PLAY_RELEASE_NOTES_HU.txt
            fi
          } > "$RUNNER_TEMP/release-notes.md"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "apk=dist/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "aab=dist/$AAB_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_checksum=dist/$APK_NAME.sha256" >> "$GITHUB_OUTPUT"
          echo "aab_checksum=dist/$AAB_NAME.sha256" >> "$GITHUB_OUTPUT"
          echo "play_track=$PLAY_TRACK" >> "$GITHUB_OUTPUT"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meter-reader-${{ inputs.channel }}-${{ inputs.version_name }}-${{ github.run_number }}
          path: |
            ${{ steps.prepare.outputs.apk }}
            ${{ steps.prepare.outputs.aab }}
            ${{ steps.prepare.outputs.apk_checksum }}
            ${{ steps.prepare.outputs.aab_checksum }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB to Google Play
        if: ${{ inputs.publish_to_play }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: hu.merenyimiklos.meterreader
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ steps.prepare.outputs.play_track }}
          status: completed
          releaseName: ${{ steps.prepare.outputs.title }}
          whatsNewDirectory: distribution/whatsnew

      - name: Create closed beta GitHub draft release
        if: ${{ inputs.channel == 'beta' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${{ steps.prepare.outputs.tag }}" \
            "${{ steps.prepare.outputs.apk }}" \
            "${{ steps.prepare.outputs.aab }}" \
            "${{ steps.prepare.outputs.apk_checksum }}" \
            "${{ steps.prepare.outputs.aab_checksum }}" \
            --target "${{ steps.source.outputs.ref }}" \
            --title "${{ steps.prepare.outputs.title }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft \
            --prerelease

      - name: Create stable GitHub release
        if: ${{ inputs.channel == 'stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${{ steps.prepare.outputs.tag }}" \
            "${{ steps.prepare.outputs.apk }}" \
            "${{ steps.prepare.outputs.aab }}" \
            "${{ steps.prepare.outputs.apk_checksum }}" \
            "${{ steps.prepare.outputs.aab_checksum }}" \
            --target "${{ steps.source.outputs.ref }}" \
            --title "${{ steps.prepare.outputs.title }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## Release elkészült"
            echo
            echo "- Csatorna: ${{ inputs.channel }}"
            echo "- Verzió: ${APP_VERSION_NAME} (${APP_VERSION_CODE})"
            echo "- Tag: ${{ steps.prepare.outputs.tag }}"
            echo "- Play track: ${{ steps.prepare.outputs.play_track }}"
            echo "- Play feltöltés: ${{ inputs.publish_to_play }}"
            echo "- Upload cert SHA-1: ${UPLOAD_CERT_SHA1:-unknown}"
            echo
            if [[ "${{ inputs.channel }}" == "beta" ]]; then
              echo "A GitHub Release Draft + Prerelease."
              echo "A Google Play kiadás csak a Closed testing track tesztelőinek látható."
            else
              echo "A GitHub Release Latest."
              echo "A Google Play kiadás a production trackre kerül."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
