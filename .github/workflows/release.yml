name: Create App Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Kiadási csatorna"
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
      source_run_id:
        description: "Opcionális: sikeres GitHub Action run ID. Ha megadod, ezt használja a source_ref helyett."
        required: false
        default: ""
        type: string
      source_ref:
        description: "Branch, tag vagy commit SHA, ha nem adsz meg run ID-t"
        required: true
        default: main
        type: string
      version_name:
        description: "Verziónév, pl. 0.5.0"
        required: true
        default: "0.5.0"
        type: string
      version_code:
        description: "Android versionCode, mindig növekvő egész szám"
        required: true
        default: "5"
        type: string
      release_notes:
        description: "Rövid kiadási megjegyzés"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: app-release-${{ inputs.channel }}-${{ inputs.version_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and publish ${{ inputs.channel }}
    runs-on: ubuntu-latest

    env:
      APP_VERSION_NAME: ${{ inputs.version_name }}
      APP_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_REF_INPUT: ${{ inputs.source_ref }}

    steps:
      - name: Resolve source Action or ref
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$SOURCE_RUN_ID" ]]; then
            if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::source_run_id must be a numeric GitHub Actions run ID."
              exit 1
            fi

            RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
            STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.status')"
            CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion')"
            SHA="$(printf '%s' "$RUN_JSON" | jq -r '.head_sha')"
            RUN_URL="$(printf '%s' "$RUN_JSON" | jq -r '.html_url')"

            if [[ "$STATUS" != "completed" || "$CONCLUSION" != "success" ]]; then
              echo "::error::The selected Action run must be completed successfully."
              exit 1
            fi

            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "description=Action run #$SOURCE_RUN_ID ($SHA)" >> "$GITHUB_OUTPUT"
            echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$SOURCE_REF_INPUT" >> "$GITHUB_OUTPUT"
            echo "description=ref $SOURCE_REF_INPUT" >> "$GITHUB_OUTPUT"
            echo "run_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$APP_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "version_code must be a positive integer."
            exit 1
          fi

          if ! [[ "$APP_VERSION_NAME" =~ ^[0-9]+([.][0-9]+){1,3}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version_name must look like 0.5.0 or 0.5.0-beta.1."
            exit 1
          fi

          if [[ "${{ inputs.channel }}" == "stable" ]]; then
            missing=0
            for name in               ANDROID_KEYSTORE_BASE64               ANDROID_KEYSTORE_PASSWORD               ANDROID_KEY_ALIAS               ANDROID_KEY_PASSWORD
            do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::Missing GitHub Actions secret: $name"
                missing=1
              fi
            done

            if [[ "$missing" -ne 0 ]]; then
              echo "::error::Stable release requires the permanent Android signing key."
              exit 1
            fi
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Prepare Android signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/meter-reader-release.jks"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | sed '/^---/d' \
            | tr -d '\r\n ' \
            | base64 --decode > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare release files
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"

          if [[ "${{ inputs.channel }}" == "beta" ]]; then
            FILE_NAME="meter-reader-${APP_VERSION_NAME}-beta-${GITHUB_RUN_NUMBER}.apk"
            TAG="v${APP_VERSION_NAME}-beta.${GITHUB_RUN_NUMBER}"
            TITLE="Mérőóra Napló ${APP_VERSION_NAME} Beta #${GITHUB_RUN_NUMBER}"
          else
            SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
            FILE_NAME="meter-reader-${APP_VERSION_NAME}.apk"
            TAG="v${APP_VERSION_NAME}"
            TITLE="Mérőóra Napló ${APP_VERSION_NAME}"
          fi

          test -f "$SOURCE_APK"
          cp "$SOURCE_APK" "dist/$FILE_NAME"
          sha256sum "dist/$FILE_NAME" > "dist/$FILE_NAME.sha256"

          {
            echo "## Mérőóra Napló ${APP_VERSION_NAME}"
            echo
            if [[ "${{ inputs.channel }}" == "beta" ]]; then
              echo "**Csatorna:** zárt béta / Draft + Prerelease"
            else
              echo "**Csatorna:** stable"
            fi
            echo
            echo "- Version code: ${APP_VERSION_CODE}"
            echo "- Forrás: ${{ steps.source.outputs.description }}"
            if [[ -n "${{ steps.source.outputs.run_url }}" ]]; then
              echo "- Forrás Action: ${{ steps.source.outputs.run_url }}"
            fi
            echo "- Release workflow run: ${GITHUB_RUN_NUMBER}"
            echo
            if [[ -n "$RELEASE_NOTES_INPUT" ]]; then
              echo "### Megjegyzések"
              printf '%s\n' "$RELEASE_NOTES_INPUT"
            fi
          } > "$RUNNER_TEMP/release-notes.md"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "apk=dist/$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$FILE_NAME.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: meter-reader-${{ inputs.channel }}-${{ inputs.version_name }}-${{ github.run_number }}
          path: |
            ${{ steps.prepare.outputs.apk }}
            ${{ steps.prepare.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

      - name: Create closed beta draft release
        if: ${{ inputs.channel == 'beta' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.prepare.outputs.tag }}"             "${{ steps.prepare.outputs.apk }}"             "${{ steps.prepare.outputs.checksum }}"             --target "$GITHUB_SHA"             --title "${{ steps.prepare.outputs.title }}"             --notes-file "$RUNNER_TEMP/release-notes.md"             --draft             --prerelease

      - name: Create stable release
        if: ${{ inputs.channel == 'stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.prepare.outputs.tag }}"             "${{ steps.prepare.outputs.apk }}"             "${{ steps.prepare.outputs.checksum }}"             --target "$GITHUB_SHA"             --title "${{ steps.prepare.outputs.title }}"             --notes-file "$RUNNER_TEMP/release-notes.md"             --latest

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## Release elkészült"
            echo
            echo "- Csatorna: ${{ inputs.channel }}"
            echo "- Verzió: ${APP_VERSION_NAME} (${APP_VERSION_CODE})"
            echo "- Tag: ${{ steps.prepare.outputs.tag }}"
            if [[ "${{ inputs.channel }}" == "beta" ]]; then
              echo "- A GitHub Release Draft, ezért nem publikus."
            else
              echo "- A GitHub Release publikus és latest."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
